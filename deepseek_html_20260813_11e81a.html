<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة المحل | المبيعات</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== نفس الـ Styles من products.html مع إضافات ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0b0b0b;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: #111;
            border-radius: 32px;
            padding: 28px 30px 40px;
            border: 1px solid #c9a84c30;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .dashboard-grid {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        .sidebar {
            flex: 0 0 210px;
            background: #1b1b1b;
            border-radius: 28px;
            padding: 28px 16px;
            border: 1px solid #2f2f2f;
            height: fit-content;
            box-shadow: inset 0 0 10px #00000055;
        }

        .sidebar .logo-small {
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .sidebar .logo-small i {
            color: #c9a84c;
            font-size: 32px;
            background: #252525;
            padding: 12px;
            border-radius: 18px;
        }

        .sidebar .logo-small h2 {
            color: #ece6de;
            font-weight: 300;
            font-size: 18px;
            margin-top: 8px;
        }

        .sidebar .logo-small h2 span {
            color: #c9a84c;
            font-weight: 600;
        }

        .sidebar nav ul {
            list-style: none;
        }

        .sidebar nav ul li {
            margin-bottom: 6px;
        }

        .sidebar nav ul li a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            color: #b5aea4;
            text-decoration: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 400;
            transition: 0.2s;
        }

        .sidebar nav ul li a i {
            width: 22px;
            color: #8f877c;
            transition: 0.2s;
        }

        .sidebar nav ul li a:hover,
        .sidebar nav ul li a.active {
            background: #2a2a2a;
            color: #f5efe7;
        }

        .sidebar nav ul li a:hover i,
        .sidebar nav ul li a.active i {
            color: #c9a84c;
        }

        .sidebar .logout-btn {
            margin-top: 40px;
            border-top: 1px solid #2a2a2a;
            padding-top: 20px;
        }

        .sidebar .logout-btn a {
            color: #b18f4a;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 40px;
            transition: 0.2s;
            cursor: pointer;
        }

        .sidebar .logout-btn a:hover {
            background: #2a1f1f;
            color: #dbb95a;
        }

        .main-content {
            flex: 1;
            min-width: 280px;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .main-header h2 {
            color: #f0ebe5;
            font-weight: 300;
            font-size: 26px;
        }

        .main-header h2 i {
            color: #c9a84c;
            margin-left: 12px;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            text-decoration: none;
        }

        .btn-gold {
            background: linear-gradient(145deg, #c9a84c, #b08d3a);
            color: #0b0b0b;
            box-shadow: 0 4px 0 #7a632b;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            background: linear-gradient(145deg, #dbb95a, #b8933a);
            box-shadow: 0 6px 0 #7a632b;
        }

        .btn-gold:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #7a632b;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #c9a84c60;
            color: #c9a84c;
        }

        .btn-outline:hover {
            background: #c9a84c20;
            border-color: #c9a84c;
        }

        .btn-secondary {
            background: #2a2a2a;
            color: #cfc8be;
            border: 1px solid #3a3a3a;
        }

        .btn-secondary:hover {
            background: #353535;
        }

        .btn-sm {
            padding: 6px 14px;
            border-radius: 40px;
            border: none;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-sm.remove {
            background: #3d1f1f;
            color: #e06868;
        }

        .btn-sm.remove:hover {
            background: #4d2a2a;
        }

        .btn-sm.add {
            background: #1f3322;
            color: #8fc99a;
        }

        .btn-sm.add:hover {
            background: #2a442e;
        }

        .invoice-creator {
            background: #161616;
            border-radius: 28px;
            padding: 24px 22px;
            border: 1px solid #252525;
            margin-bottom: 32px;
        }

        .invoice-creator h3 {
            color: #e6dccf;
            font-weight: 300;
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .invoice-creator h3 i {
            color: #c9a84c;
        }

        .invoice-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 20px;
            margin-bottom: 20px;
        }

        .inv-form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .inv-form-group label {
            color: #cfc8be;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .inv-form-group input,
        .inv-form-group select {
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 60px;
            padding: 12px 18px;
            color: #f0ebe5;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .inv-form-group input:focus,
        .inv-form-group select:focus {
            border-color: #c9a84c;
            box-shadow: 0 0 12px #c9a84c30;
        }

        .inv-form-group input::placeholder {
            color: #6b6560;
        }

        .inv-form-group.full {
            grid-column: 1 / -1;
        }

        .product-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            background: #1f1f1f;
            padding: 14px 18px;
            border-radius: 60px;
            margin-bottom: 10px;
        }

        .product-row select,
        .product-row input {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 40px;
            padding: 10px 16px;
            color: #f0ebe5;
            font-size: 14px;
            outline: none;
            flex: 1;
            min-width: 100px;
        }

        .product-row select:focus,
        .product-row input:focus {
            border-color: #c9a84c;
        }

        .product-row .btn-sm {
            padding: 8px 16px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .invoice-total {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 30px;
            padding: 16px 20px;
            background: #1f1f1f;
            border-radius: 60px;
            margin-top: 16px;
            border: 1px solid #2a2a2a;
        }

        .invoice-total span {
            color: #b8aea1;
            font-size: 15px;
        }

        .invoice-total .total-amount {
            color: #c9a84c;
            font-size: 28px;
            font-weight: 700;
        }

        .invoice-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .sales-history {
            background: #161616;
            border-radius: 28px;
            padding: 24px 22px;
            border: 1px solid #252525;
        }

        .sales-history h3 {
            color: #e6dccf;
            font-weight: 300;
            font-size: 20px;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sales-history h3 i {
            color: #c9a84c;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            color: #d6cec2;
            font-size: 14px;
            min-width: 800px;
        }

        .table-wrapper th {
            text-align: right;
            padding: 14px 12px 10px 12px;
            border-bottom: 1px solid #2a2a2a;
            color: #b8aea1;
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .table-wrapper td {
            padding: 14px 12px;
            border-bottom: 1px solid #222;
            vertical-align: middle;
        }

        .table-wrapper tr:hover td {
            background: #1f1f1f;
        }

        .badge.success {
            background: #1f3322;
            color: #8fc99a;
            padding: 4px 16px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        @media (max-width: 920px) {
            .sidebar {
                flex: 1 1 100%;
            }
            .dashboard-grid {
                flex-direction: column;
            }
            .invoice-form-grid {
                grid-template-columns: 1fr;
            }
            .product-row {
                flex-direction: column;
                align-items: stretch;
                border-radius: 24px;
            }
            .invoice-total {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .invoice-actions {
                flex-direction: column;
            }
            .invoice-actions .btn {
                justify-content: center;
            }
        }

        @media (max-width: 600px) {
            .app-wrapper {
                padding: 16px;
            }
            .main-header {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="dashboard-grid">

            <!-- القائمة الجانبية -->
            <aside class="sidebar">
                <div class="logo-small">
                    <i class="fas fa-crown"></i>
                    <h2><span>أزياء</span> الذهب</h2>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html"><i class="fas fa-chart-pie"></i> لوحة التحكم</a></li>
                        <li><a href="products.html"><i class="fas fa-boxes"></i> المنتجات</a></li>
                        <li><a href="sales.html" class="active"><i class="fas fa-file-invoice"></i> المبيعات</a></li>
                        <li><a href="customers.html"><i class="fas fa-users"></i> العملاء</a></li>
                        <li><a href="settings.html"><i class="fas fa-cog"></i> الإعدادات</a></li>
                    </ul>
                </nav>
                <div class="logout-btn">
                    <a href="index.html" id="logoutLink"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
                </div>
            </aside>

            <!-- المحتوى الرئيسي -->
            <main class="main-content">
                <div class="main-header">
                    <h2><i class="fas fa-cash-register"></i> المبيعات والفواتير</h2>
                    <button class="btn btn-outline" id="clearInvoiceBtn">
                        <i class="fas fa-undo"></i> إعادة تعيين
                    </button>
                </div>

                <!-- قسم إنشاء الفاتورة -->
                <div class="invoice-creator">
                    <h3><i class="fas fa-plus-circle"></i> إنشاء فاتورة جديدة</h3>

                    <div class="invoice-form-grid">
                        <div class="inv-form-group">
                            <label>رقم الفاتورة</label>
                            <input type="text" id="invoiceNumber" readonly style="color:#c9a84c;" />
                        </div>
                        <div class="inv-form-group">
                            <label>التاريخ</label>
                            <input type="date" id="invoiceDate" />
                        </div>
                        <div class="inv-form-group full">
                            <label>اسم العميل</label>
                            <input type="text" id="customerName" placeholder="أدخل اسم العميل" />
                        </div>
                    </div>

                    <div id="invoiceProductsContainer">
                        <div class="product-row">
                            <select class="product-select">
                                <option value="">اختر منتج...</option>
                            </select>
                            <input type="number" class="product-qty" placeholder="الكمية" min="1" value="1" />
                            <input type="text" class="product-price" placeholder="السعر" readonly style="background:#1a1a1a; color:#c9a84c;" />
                            <button class="btn-sm remove remove-row"><i class="fas fa-times"></i></button>
                            <button class="btn-sm add add-row"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>

                    <div class="invoice-total">
                        <span>المجموع الكلي:</span>
                        <span class="total-amount" id="grandTotal">0.00 ر.س</span>
                    </div>

                    <div class="invoice-actions">
                        <button class="btn btn-gold" id="createInvoiceBtn">
                            <i class="fas fa-save"></i> إنشاء الفاتورة
                        </button>
                        <button class="btn btn-outline" id="printInvoiceBtn">
                            <i class="fas fa-print"></i> طباعة
                        </button>
                    </div>
                </div>

                <!-- سجل المبيعات -->
                <div class="sales-history">
                    <h3><i class="fas fa-history"></i> سجل المبيعات السابقة</h3>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>رقم الفاتورة</th>
                                    <th>التاريخ</th>
                                    <th>العميل</th>
                                    <th>المنتجات</th>
                                    <th>المجموع</th>
                                    <th>الحالة</th>
                                </tr>
                            </thead>
                            <tbody id="salesHistoryBody">
                                <!-- يتم تعبئتها عبر JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // ============================================================
        //  دوال localStorage
        // ============================================================

        function getProducts() {
            return JSON.parse(localStorage.getItem('products')) || [];
        }

        function saveProducts(products) {
            localStorage.setItem('products', JSON.stringify(products));
        }

        function getSales() {
            return JSON.parse(localStorage.getItem('sales')) || [];
        }

        function saveSales(sales) {
            localStorage.setItem('sales', JSON.stringify(sales));
        }

        function getSettings() {
            return JSON.parse(localStorage.getItem('settings')) || {
                invoicePrefix: 'INV-2026-',
                invoiceNextNum: 4,
                invoiceNote: 'شكراً لتسوقكم من أزياء الذهب'
            };
        }

        function getCustomers() {
            return JSON.parse(localStorage.getItem('customers')) || [];
        }

        // ============================================================
        //  عناصر DOM
        // ============================================================

        const container = document.getElementById('invoiceProductsContainer');
        const grandTotalEl = document.getElementById('grandTotal');
        const createBtn = document.getElementById('createInvoiceBtn');
        const printBtn = document.getElementById('printInvoiceBtn');
        const clearBtn = document.getElementById('clearInvoiceBtn');
        const salesBody = document.getElementById('salesHistoryBody');
        const customerNameInput = document.getElementById('customerName');
        const invoiceDateInput = document.getElementById('invoiceDate');
        const invoiceNumberInput = document.getElementById('invoiceNumber');

        // ============================================================
        //  دوال المساعدة
        // ============================================================

        function setDefaultDate() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            invoiceDateInput.value = `${yyyy}-${mm}-${dd}`;
        }

        function updateInvoiceNumber() {
            const settings = getSettings();
            const nextNum = String(settings.invoiceNextNum).padStart(3, '0');
            invoiceNumberInput.value = settings.invoicePrefix + nextNum;
        }

        function updateProductOptions(selectElement) {
            const products = getProducts();
            selectElement.innerHTML = '<option value="">اختر منتج...</option>';
            products.forEach(p => {
                if (p.quantity > 0) {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `${p.name} (${p.price} ر.س) - متبقي ${p.quantity}`;
                    selectElement.appendChild(opt);
                }
            });
        }

        function updateRowPrice(row) {
            const select = row.querySelector('.product-select');
            const qtyInput = row.querySelector('.product-qty');
            const priceInput = row.querySelector('.product-price');
            const productId = parseInt(select.value);
            const qty = parseInt(qtyInput.value) || 0;
            const products = getProducts();

            if (productId) {
                const product = products.find(p => p.id === productId);
                if (product) {
                    const total = product.price * qty;
                    priceInput.value = total.toFixed(2) + ' ر.س';
                } else {
                    priceInput.value = '0.00 ر.س';
                }
            } else {
                priceInput.value = '0.00 ر.س';
            }
            updateGrandTotal();
        }

        function updateGrandTotal() {
            let total = 0;
            const rows = container.querySelectorAll('.product-row');
            rows.forEach(row => {
                const priceInput = row.querySelector('.product-price');
                const val = parseFloat(priceInput.value) || 0;
                total += val;
            });
            grandTotalEl.textContent = total.toFixed(2) + ' ر.س';
        }

        function addProductRow() {
            const rows = container.querySelectorAll('.product-row');
            const lastRow = rows[rows.length - 1];
            const newRow = lastRow.cloneNode(true);

            newRow.querySelector('.product-select').value = '';
            newRow.querySelector('.product-qty').value = '1';
            newRow.querySelector('.product-price').value = '0.00 ر.س';

            updateProductOptions(newRow.querySelector('.product-select'));

            const select = newRow.querySelector('.product-select');
            const qty = newRow.querySelector('.product-qty');
            select.addEventListener('change', () => updateRowPrice(newRow));
            qty.addEventListener('input', () => updateRowPrice(newRow));

            const removeBtn = newRow.querySelector('.remove-row');
            const addBtn = newRow.querySelector('.add-row');

            const newRemoveBtn = removeBtn.cloneNode(true);
            const newAddBtn = addBtn.cloneNode(true);
            removeBtn.replaceWith(newRemoveBtn);
            addBtn.replaceWith(newAddBtn);

            newRemoveBtn.addEventListener('click', function() {
                if (container.querySelectorAll('.product-row').length > 1) {
                    newRow.remove();
                    updateGrandTotal();
                } else {
                    alert('يجب أن يكون هناك صف واحد على الأقل.');
                }
            });

            newAddBtn.addEventListener('click', function() {
                addProductRow();
            });

            container.appendChild(newRow);
            updateGrandTotal();
        }

        function initRows() {
            container.innerHTML = '';
            const firstRow = document.createElement('div');
            firstRow.className = 'product-row';
            firstRow.innerHTML = `
                    <select class="product-select">
                        <option value="">اختر منتج...</option>
                    </select>
                    <input type="number" class="product-qty" placeholder="الكمية" min="1" value="1" />
                    <input type="text" class="product-price" placeholder="السعر" readonly style="background:#1a1a1a; color:#c9a84c;" />
                    <button class="btn-sm remove remove-row"><i class="fas fa-times"></i></button>
                    <button class="btn-sm add add-row"><i class="fas fa-plus"></i></button>
                `;
            container.appendChild(firstRow);

            const row = container.querySelector('.product-row');
            const select = row.querySelector('.product-select');
            const qty = row.querySelector('.product-qty');
            updateProductOptions(select);
            select.addEventListener('change', () => updateRowPrice(row));
            qty.addEventListener('input', () => updateRowPrice(row));

            const removeBtn = row.querySelector('.remove-row');
            const addBtn = row.querySelector('.add-row');
            removeBtn.addEventListener('click', function() {
                if (container.querySelectorAll('.product-row').length > 1) {
                    row.remove();
                    updateGrandTotal();
                } else {
                    alert('يجب أن يكون هناك صف واحد على الأقل.');
                }
            });
            addBtn.addEventListener('click', function() {
                addProductRow();
            });

            updateRowPrice(row);
            updateGrandTotal();
        }

        // ============================================================
        //  إنشاء الفاتورة
        // ============================================================

        function createInvoice() {
            const customer = customerNameInput.value.trim() || 'عميل غير محدد';
            const date = invoiceDateInput.value || new Date().toISOString().split('T')[0];
            const rows = container.querySelectorAll('.product-row');

            const items = [];
            let hasError = false;
            let products = getProducts();

            rows.forEach(row => {
                const select = row.querySelector('.product-select');
                const qtyInput = row.querySelector('.product-qty');
                const productId = parseInt(select.value);
                const qty = parseInt(qtyInput.value) || 0;

                if (productId && qty > 0) {
                    const product = products.find(p => p.id === productId);
                    if (product) {
                        if (qty > product.quantity) {
                            alert(`الكمية المطلوبة للمنتج "${product.name}" (${qty}) أكبر من المتاح (${product.quantity}).`);
                            hasError = true;
                            return;
                        }
                        items.push({ name: product.name, qty: qty, price: product.price });
                        product.quantity -= qty;
                    }
                }
            });

            if (hasError) return;

            if (items.length === 0) {
                alert('الرجاء إضافة منتج واحد على الأقل.');
                return;
            }

            const total = items.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const settings = getSettings();
            const invoiceNumber = settings.invoicePrefix + String(settings.invoiceNextNum).padStart(3, '0');
            settings.invoiceNextNum++;
            localStorage.setItem('settings', JSON.stringify(settings));

            const sales = getSales();
            sales.push({
                id: invoiceNumber,
                date: date,
                customer: customer,
                items: items,
                total: total,
                status: 'مكتمل'
            });
            saveSales(sales);
            saveProducts(products);

            // إضافة العميل إذا لم يكن موجوداً
            const customers = getCustomers();
            if (!customers.find(c => c.name === customer)) {
                customers.push({
                    id: parseInt(localStorage.getItem('nextCustomerId')) || 6,
                    name: customer,
                    phone: 'غير محدد',
                    purchases: `آخر شراء: ${date}`
                });
                localStorage.setItem('customers', JSON.stringify(customers));
                let nextId = parseInt(localStorage.getItem('nextCustomerId')) || 6;
                localStorage.setItem('nextCustomerId', String(nextId + 1));
            }

            updateInvoiceNumber();
            resetInvoiceForm();
            alert(`✅ تم إنشاء الفاتورة ${invoiceNumber} بنجاح! المجموع: ${total.toFixed(2)} ر.س`);
            renderSalesHistory();
            updateAllRows();
        }

        // ============================================================
        //  دوال العرض
        // ============================================================

        function resetInvoiceForm() {
            customerNameInput.value = '';
            setDefaultDate();
            container.innerHTML = '';
            initRows();
            updateInvoiceNumber();
        }

        function renderSalesHistory() {
            const sales = getSales();
            if (sales.length === 0) {
                salesBody.innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align:center; padding:40px; color:#8f877c;">
                                <i class="fas fa-receipt" style="font-size:32px; display:block; margin-bottom:10px;"></i>
                                لا توجد مبيعات مسجلة
                            </td>
                        </tr>
                    `;
                return;
            }

            let html = '';
            sales.slice().reverse().forEach(inv => {
                const itemsList = inv.items.map(item => `${item.name} (${item.qty})`).join('، ');
                html += `
                        <tr>
                            <td><strong style="color:#c9a84c;">${inv.id}</strong></td>
                            <td>${inv.date}</td>
                            <td>${inv.customer}</td>
                            <td>${itemsList}</td>
                            <td>${inv.total.toFixed(2)} ر.س</td>
                            <td><span class="badge success">${inv.status}</span></td>
                        </tr>
                    `;
            });
            salesBody.innerHTML = html;
        }

        function updateAllRows() {
            const rows = container.querySelectorAll('.product-row');
            rows.forEach(row => {
                const select = row.querySelector('.product-select');
                updateProductOptions(select);
                select.addEventListener('change', () => updateRowPrice(row));
                const qtyInput = row.querySelector('.product-qty');
                qtyInput.addEventListener('input', () => updateRowPrice(row));
                updateRowPrice(row);
            });
            updateGrandTotal();
        }

        // ============================================================
        //  طباعة الفاتورة
        // ============================================================

        function printInvoice() {
            const customer = customerNameInput.value.trim() || 'عميل غير محدد';
            const date = invoiceDateInput.value || new Date().toISOString().split('T')[0];
            const rows = container.querySelectorAll('.product-row');
            let items = [];
            let total = 0;
            const products = getProducts();

            rows.forEach(row => {
                const select = row.querySelector('.product-select');
                const qtyInput = row.querySelector('.product-qty');
                const productId = parseInt(select.value);
                const qty = parseInt(qtyInput.value) || 0;
                if (productId && qty > 0) {
                    const product = products.find(p => p.id === productId);
                    if (product) {
                        items.push({ name: product.name, qty, price: product.price });
                        total += product.price * qty;
                    }
                }
            });

            if (items.length === 0) {
                alert('لا توجد منتجات للطباعة.');
                return;
            }

            const settings = getSettings();
            let printContent = `
                    ============================================
                    🏬 ${settings.shopName || 'أزياء الذهب'} - فاتورة مبيعات
                    ============================================
                    رقم الفاتورة: ${invoiceNumberInput.value}
                    التاريخ: ${date}
                    العميل: ${customer}
                    --------------------------------------------
                    المنتج                الكمية    السعر
            `;

            items.forEach(item => {
                printContent += `                    ${item.name.padEnd(20)} ${item.qty}       ${(item.price * item.qty).toFixed(2)} ر.س\n`;
            });

            printContent += `
                    --------------------------------------------
                    المجموع الكلي:                         ${total.toFixed(2)} ر.س
                    ============================================
                    ${settings.invoiceNote || 'شكراً لتسوقكم'}
            `;

            const printWindow = window.open('', '_blank', 'width=600,height=400');
            printWindow.document.write(`<pre style="direction:ltr; font-family:monospace; font-size:14px;">${printContent}</pre>`);
            printWindow.document.close();
            printWindow.print();
        }

        // ============================================================
        //  ربط الأحداث
        // ============================================================

        createBtn.addEventListener('click', createInvoice);
        printBtn.addEventListener('click', printInvoice);
        clearBtn.addEventListener('click', resetInvoiceForm);

        document.getElementById('logoutLink').addEventListener('click', function(e) {
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('currentUser');
        });

        // ============================================================
        //  التحقق من الدخول
        // ============================================================

        function checkAuth() {
            if (localStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'index.html';
            }
        }

        // ============================================================
        //  التهيئة
        // ============================================================

        checkAuth();
        setDefaultDate();
        initRows();
        renderSalesHistory();
        updateInvoiceNumber();
        console.log('✅ صفحة المبيعات جاهزة مع localStorage');
    </script>

</body>
</html>

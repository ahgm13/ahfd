<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة المحل | العملاء والموردين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== نفس الـ Styles من المنتجات مع إضافات ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0b0b0b;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            background: #111;
            border-radius: 32px;
            padding: 28px 30px 40px;
            border: 1px solid #c9a84c30;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
        }

        .dashboard-grid {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        .sidebar {
            flex: 0 0 210px;
            background: #1b1b1b;
            border-radius: 28px;
            padding: 28px 16px;
            border: 1px solid #2f2f2f;
            height: fit-content;
            box-shadow: inset 0 0 10px #00000055;
        }

        .sidebar .logo-small {
            text-align: center;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .sidebar .logo-small i {
            color: #c9a84c;
            font-size: 32px;
            background: #252525;
            padding: 12px;
            border-radius: 18px;
        }

        .sidebar .logo-small h2 {
            color: #ece6de;
            font-weight: 300;
            font-size: 18px;
            margin-top: 8px;
        }

        .sidebar .logo-small h2 span {
            color: #c9a84c;
            font-weight: 600;
        }

        .sidebar nav ul {
            list-style: none;
        }

        .sidebar nav ul li {
            margin-bottom: 6px;
        }

        .sidebar nav ul li a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 18px;
            color: #b5aea4;
            text-decoration: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 400;
            transition: 0.2s;
        }

        .sidebar nav ul li a i {
            width: 22px;
            color: #8f877c;
            transition: 0.2s;
        }

        .sidebar nav ul li a:hover,
        .sidebar nav ul li a.active {
            background: #2a2a2a;
            color: #f5efe7;
        }

        .sidebar nav ul li a:hover i,
        .sidebar nav ul li a.active i {
            color: #c9a84c;
        }

        .sidebar .logout-btn {
            margin-top: 40px;
            border-top: 1px solid #2a2a2a;
            padding-top: 20px;
        }

        .sidebar .logout-btn a {
            color: #b18f4a;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 40px;
            transition: 0.2s;
            cursor: pointer;
        }

        .sidebar .logout-btn a:hover {
            background: #2a1f1f;
            color: #dbb95a;
        }

        .main-content {
            flex: 1;
            min-width: 280px;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .main-header h2 {
            color: #f0ebe5;
            font-weight: 300;
            font-size: 26px;
        }

        .main-header h2 i {
            color: #c9a84c;
            margin-left: 12px;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            text-decoration: none;
        }

        .btn-gold {
            background: linear-gradient(145deg, #c9a84c, #b08d3a);
            color: #0b0b0b;
            box-shadow: 0 4px 0 #7a632b;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            background: linear-gradient(145deg, #dbb95a, #b8933a);
            box-shadow: 0 6px 0 #7a632b;
        }

        .btn-gold:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #7a632b;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #c9a84c60;
            color: #c9a84c;
        }

        .btn-outline:hover {
            background: #c9a84c20;
            border-color: #c9a84c;
        }

        .btn-secondary {
            background: #2a2a2a;
            color: #cfc8be;
            border: 1px solid #3a3a3a;
        }

        .btn-secondary:hover {
            background: #353535;
        }

        .tab-switch {
            display: flex;
            gap: 4px;
            background: #1b1b1b;
            border-radius: 60px;
            padding: 4px;
            border: 1px solid #2a2a2a;
            margin-bottom: 28px;
            width: fit-content;
        }

        .tab-switch button {
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            background: transparent;
            color: #b5aea4;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-switch button.active {
            background: #c9a84c;
            color: #0b0b0b;
            box-shadow: 0 4px 12px #c9a84c40;
        }

        .tab-switch button:hover:not(.active) {
            color: #f0ebe5;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .search-bar {
            background: #1b1b1b;
            border-radius: 60px;
            padding: 6px 6px 6px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid #2a2a2a;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-bar i {
            color: #8f877c;
            font-size: 18px;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: #f0ebe5;
            font-size: 15px;
            outline: none;
            min-width: 140px;
        }

        .search-bar input::placeholder {
            color: #6b6560;
        }

        .search-bar .btn {
            border-radius: 40px;
            padding: 10px 24px;
        }

        .table-wrapper {
            background: #161616;
            border-radius: 28px;
            padding: 20px 18px;
            border: 1px solid #252525;
            overflow-x: auto;
        }

        .table-wrapper table {
            width: 100%;
            border-collapse: collapse;
            color: #d6cec2;
            font-size: 14px;
            min-width: 600px;
        }

        .table-wrapper th {
            text-align: right;
            padding: 16px 12px 12px 12px;
            border-bottom: 1px solid #2a2a2a;
            color: #b8aea1;
            font-weight: 500;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .table-wrapper td {
            padding: 16px 12px;
            border-bottom: 1px solid #222;
            vertical-align: middle;
        }

        .table-wrapper tr:hover td {
            background: #1f1f1f;
        }

        .action-icons {
            display: flex;
            gap: 12px;
        }

        .action-icons a {
            color: #8f877c;
            transition: 0.2s;
            font-size: 16px;
            cursor: pointer;
        }

        .action-icons a:hover {
            color: #c9a84c;
        }

        .action-icons a.delete:hover {
            color: #e06868;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #1a1a1a;
            border-radius: 32px;
            padding: 36px 32px;
            max-width: 560px;
            width: 100%;
            border: 1px solid #c9a84c40;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
            animation: fadeUp 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-box h3 {
            color: #f0ebe5;
            font-weight: 300;
            font-size: 24px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-box h3 i {
            color: #c9a84c;
        }

        .modal-close {
            margin-right: auto;
            background: none;
            border: none;
            color: #8f877c;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            color: #e06868;
            transform: rotate(90deg);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            color: #cfc8be;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group textarea {
            background: #252525;
            border: 1px solid #3a3a3a;
            border-radius: 60px;
            padding: 12px 18px;
            color: #f0ebe5;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-group textarea {
            border-radius: 20px;
            resize: vertical;
            min-height: 60px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #c9a84c;
            box-shadow: 0 0 12px #c9a84c30;
        }

        .modal-actions {
            display: flex;
            gap: 14px;
            margin-top: 20px;
            justify-content: flex-end;
        }

        .modal-actions .btn {
            padding: 12px 32px;
        }

        @media (max-width: 920px) {
            .sidebar {
                flex: 1 1 100%;
            }
            .dashboard-grid {
                flex-direction: column;
            }
            .tab-switch {
                width: 100%;
                justify-content: center;
            }
            .tab-switch button {
                flex: 1;
                text-align: center;
                padding: 10px 16px;
                font-size: 13px;
            }
            .search-bar {
                border-radius: 28px;
                padding: 16px;
                flex-direction: column;
            }
            .search-bar input {
                width: 100%;
            }
            .search-bar .btn {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 600px) {
            .app-wrapper {
                padding: 16px;
            }
            .main-header {
                flex-direction: column;
                align-items: stretch;
            }
            .modal-box {
                padding: 24px 18px;
            }
            .table-wrapper table {
                min-width: 500px;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="dashboard-grid">

            <!-- القائمة الجانبية -->
            <aside class="sidebar">
                <div class="logo-small">
                    <i class="fas fa-crown"></i>
                    <h2><span>أزياء</span> الذهب</h2>
                </div>
                <nav>
                    <ul>
                        <li><a href="index.html"><i class="fas fa-chart-pie"></i> لوحة التحكم</a></li>
                        <li><a href="products.html"><i class="fas fa-boxes"></i> المنتجات</a></li>
                        <li><a href="sales.html"><i class="fas fa-file-invoice"></i> المبيعات</a></li>
                        <li><a href="customers.html" class="active"><i class="fas fa-users"></i> العملاء</a></li>
                        <li><a href="settings.html"><i class="fas fa-cog"></i> الإعدادات</a></li>
                    </ul>
                </nav>
                <div class="logout-btn">
                    <a href="index.html" id="logoutLink"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a>
                </div>
            </aside>

            <!-- المحتوى الرئيسي -->
            <main class="main-content">
                <div class="main-header">
                    <h2><i class="fas fa-handshake"></i> العملاء والموردين</h2>
                </div>

                <div class="tab-switch">
                    <button class="active" data-tab="customers"><i class="fas fa-user"></i> العملاء</button>
                    <button data-tab="suppliers"><i class="fas fa-truck"></i> الموردين</button>
                </div>

                <!-- تبويب العملاء -->
                <div id="tab-customers" class="tab-content active">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="customerSearch" placeholder="ابحث باسم العميل أو رقم الهاتف..." />
                        <button class="btn btn-gold" id="searchCustomerBtn"><i class="fas fa-filter"></i> بحث</button>
                        <button class="btn btn-outline" id="addCustomerBtn"><i class="fas fa-plus"></i> إضافة عميل</button>
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>اسم العميل</th>
                                    <th>رقم الهاتف</th>
                                    <th>تاريخ المشتريات</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="customersTableBody"></tbody>
                        </table>
                    </div>
                </div>

                <!-- تبويب الموردين -->
                <div id="tab-suppliers" class="tab-content">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="supplierSearch" placeholder="ابحث باسم المورد أو رقم الهاتف..." />
                        <button class="btn btn-gold" id="searchSupplierBtn"><i class="fas fa-filter"></i> بحث</button>
                        <button class="btn btn-outline" id="addSupplierBtn"><i class="fas fa-plus"></i> إضافة مورد</button>
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>اسم المورد</th>
                                    <th>رقم الهاتف</th>
                                    <th>المنتجات الموردة</th>
                                    <th>سجل التوريدات</th>
                                    <th>الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="suppliersTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- مودال العملاء -->
    <div class="modal-overlay" id="customerModal">
        <div class="modal-box">
            <h3>
                <i class="fas fa-user"></i>
                <span id="customerModalTitle">إضافة عميل جديد</span>
                <button class="modal-close" id="closeCustomerModal">&times;</button>
            </h3>
            <form id="customerForm">
                <div class="form-group">
                    <label>اسم العميل</label>
                    <input type="text" id="customerName" placeholder="أدخل اسم العميل" required />
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="text" id="customerPhone" placeholder="05xxxxxxxx" />
                </div>
                <div class="form-group">
                    <label>تاريخ المشتريات</label>
                    <input type="text" id="customerPurchases" placeholder="آخر عملية شراء أو ملاحظات" />
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelCustomerBtn">إلغاء</button>
                    <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> حفظ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- مودال الموردين -->
    <div class="modal-overlay" id="supplierModal">
        <div class="modal-box">
            <h3>
                <i class="fas fa-truck"></i>
                <span id="supplierModalTitle">إضافة مورد جديد</span>
                <button class="modal-close" id="closeSupplierModal">&times;</button>
            </h3>
            <form id="supplierForm">
                <div class="form-group">
                    <label>اسم المورد</label>
                    <input type="text" id="supplierName" placeholder="أدخل اسم المورد" required />
                </div>
                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="text" id="supplierPhone" placeholder="05xxxxxxxx" />
                </div>
                <div class="form-group">
                    <label>المنتجات التي يوفرها</label>
                    <input type="text" id="supplierProducts" placeholder="مثال: أحذية، تيشيرتات" />
                </div>
                <div class="form-group">
                    <label>سجل التوريدات</label>
                    <textarea id="supplierHistory" placeholder="آخر توريد أو ملاحظات"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelSupplierBtn">إلغاء</button>
                    <button type="submit" class="btn btn-gold"><i class="fas fa-save"></i> حفظ</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ============================================================
        //  دوال localStorage
        // ============================================================

        function getCustomers() {
            return JSON.parse(localStorage.getItem('customers')) || [];
        }

        function saveCustomers(customers) {
            localStorage.setItem('customers', JSON.stringify(customers));
        }

        function getSuppliers() {
            return JSON.parse(localStorage.getItem('suppliers')) || [];
        }

        function saveSuppliers(suppliers) {
            localStorage.setItem('suppliers', JSON.stringify(suppliers));
        }

        function getNextCustomerId() {
            let next = parseInt(localStorage.getItem('nextCustomerId')) || 6;
            localStorage.setItem('nextCustomerId', String(next + 1));
            return next;
        }

        function getNextSupplierId() {
            let next = parseInt(localStorage.getItem('nextSupplierId')) || 5;
            localStorage.setItem('nextSupplierId', String(next + 1));
            return next;
        }

        // ============================================================
        //  عناصر DOM
        // ============================================================

        const customersBody = document.getElementById('customersTableBody');
        const suppliersBody = document.getElementById('suppliersTableBody');
        const customerSearch = document.getElementById('customerSearch');
        const supplierSearch = document.getElementById('supplierSearch');
        const searchCustomerBtn = document.getElementById('searchCustomerBtn');
        const searchSupplierBtn = document.getElementById('searchSupplierBtn');
        const addCustomerBtn = document.getElementById('addCustomerBtn');
        const addSupplierBtn = document.getElementById('addSupplierBtn');

        // مودال العملاء
        const customerModal = document.getElementById('customerModal');
        const customerModalTitle = document.getElementById('customerModalTitle');
        const customerForm = document.getElementById('customerForm');
        const customerName = document.getElementById('customerName');
        const customerPhone = document.getElementById('customerPhone');
        const customerPurchases = document.getElementById('customerPurchases');
        const closeCustomerModal = document.getElementById('closeCustomerModal');
        const cancelCustomerBtn = document.getElementById('cancelCustomerBtn');

        // مودال الموردين
        const supplierModal = document.getElementById('supplierModal');
        const supplierModalTitle = document.getElementById('supplierModalTitle');
        const supplierForm = document.getElementById('supplierForm');
        const supplierName = document.getElementById('supplierName');
        const supplierPhone = document.getElementById('supplierPhone');
        const supplierProducts = document.getElementById('supplierProducts');
        const supplierHistory = document.getElementById('supplierHistory');
        const closeSupplierModal = document.getElementById('closeSupplierModal');
        const cancelSupplierBtn = document.getElementById('cancelSupplierBtn');

        let editingCustomerId = null;
        let editingSupplierId = null;

        // ============================================================
        //  دوال العرض
        // ============================================================

        function renderCustomers(filter = '') {
            const customers = getCustomers();
            const term = filter.toLowerCase().trim();
            const filtered = customers.filter(c =>
                c.name.toLowerCase().includes(term) ||
                c.phone.includes(term)
            );

            if (filtered.length === 0) {
                customersBody.innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align:center; padding:40px; color:#8f877c;">
                                <i class="fas fa-user-slash" style="font-size:32px; display:block; margin-bottom:10px;"></i>
                                لا يوجد عملاء مطابقين للبحث
                            </td>
                        </tr>
                    `;
                return;
            }

            let html = '';
            filtered.forEach((c, index) => {
                html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${c.name}</strong></td>
                            <td>${c.phone}</td>
                            <td>${c.purchases}</td>
                            <td>
                                <div class="action-icons">
                                    <a class="edit-customer" data-id="${c.id}" title="تعديل"><i class="fas fa-pen"></i></a>
                                    <a class="delete-customer" data-id="${c.id}" title="حذف"><i class="fas fa-trash"></i></a>
                                </div>
                            </td>
                        </tr>
                    `;
            });
            customersBody.innerHTML = html;

            document.querySelectorAll('.edit-customer').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const id = parseInt(btn.dataset.id);
                    openEditCustomer(id);
                });
            });

            document.querySelectorAll('.delete-customer').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const id = parseInt(btn.dataset.id);
                    if (confirm('هل أنت متأكد من حذف هذا العميل؟')) {
                        let customers = getCustomers();
                        customers = customers.filter(c => c.id !== id);
                        saveCustomers(customers);
                        renderCustomers(customerSearch.value);
                    }
                });
            });
        }

        function renderSuppliers(filter = '') {
            const suppliers = getSuppliers();
            const term = filter.toLowerCase().trim();
            const filtered = suppliers.filter(s =>
                s.name.toLowerCase().includes(term) ||
                s.phone.includes(term)
            );

            if (filtered.length === 0) {
                suppliersBody.innerHTML = `
                        <tr>
                            <td colspan="6" style="text-align:center; padding:40px; color:#8f877c;">
                                <i class="fas fa-truck-slash" style="font-size:32px; display:block; margin-bottom:10px;"></i>
                                لا يوجد موردين مطابقين للبحث
                            </td>
                        </tr>
                    `;
                return;
            }

            let html = '';
            filtered.forEach((s, index) => {
                html += `
                        <tr>
                            <td>${index + 1}</td>
                            <td><strong>${s.name}</strong></td>
                            <td>${s.phone}</td>
                            <td>${s.products}</td>
                            <td>${s.history}</td>
                            <td>
                                <div class="action-icons">
                                    <a class="edit-supplier" data-id="${s.id}" title="تعديل"><i class="fas fa-pen"></i></a>
                                    <a class="delete-supplier" data-id="${s.id}" title="حذف"><i class="fas fa-trash"></i></a>
                                </div>
                            </td>
                        </tr>
                    `;
            });
            suppliersBody.innerHTML = html;

            document.querySelectorAll('.edit-supplier').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const id = parseInt(btn.dataset.id);
                    openEditSupplier(id);
                });
            });

            document.querySelectorAll('.delete-supplier').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const id = parseInt(btn.dataset.id);
                    if (confirm('هل أنت متأكد من حذف هذا المورد؟')) {
                        let suppliers = getSuppliers();
                        suppliers = suppliers.filter(s => s.id !== id);
                        saveSuppliers(suppliers);
                        renderSuppliers(supplierSearch.value);
                    }
                });
            });
        }

        // ============================================================
        //  دوال المودال
        // ============================================================

        function openAddCustomer() {
            editingCustomerId = null;
            customerModalTitle.textContent = 'إضافة عميل جديد';
            customerName.value = '';
            customerPhone.value = '';
            customerPurchases.value = '';
            customerModal.classList.add('active');
        }

        function openEditCustomer(id) {
            const customers = getCustomers();
            const customer = customers.find(c => c.id === id);
            if (!customer) return;
            editingCustomerId = id;
            customerModalTitle.textContent = 'تعديل بيانات العميل';
            customerName.value = customer.name;
            customerPhone.value = customer.phone;
            customerPurchases.value = customer.purchases;
            customerModal.classList.add('active');
        }

        function closeCustomerModalFn() {
            customerModal.classList.remove('active');
        }

        function saveCustomer(e) {
            e.preventDefault();
            const name = customerName.value.trim();
            const phone = customerPhone.value.trim();
            const purchases = customerPurchases.value.trim() || 'لا يوجد';

            if (!name) {
                alert('الرجاء إدخال اسم العميل.');
                return;
            }

            let customers = getCustomers();

            if (editingCustomerId) {
                const index = customers.findIndex(c => c.id === editingCustomerId);
                if (index !== -1) {
                    customers[index] = { ...customers[index], name, phone, purchases };
                }
            } else {
                customers.push({
                    id: getNextCustomerId(),
                    name,
                    phone,
                    purchases
                });
            }

            saveCustomers(customers);
            closeCustomerModalFn();
            renderCustomers(customerSearch.value);
        }

        function openAddSupplier() {
            editingSupplierId = null;
            supplierModalTitle.textContent = 'إضافة مورد جديد';
            supplierName.value = '';
            supplierPhone.value = '';
            supplierProducts.value = '';
            supplierHistory.value = '';
            supplierModal.classList.add('active');
        }

        function openEditSupplier(id) {
            const suppliers = getSuppliers();
            const supplier = suppliers.find(s => s.id === id);
            if (!supplier) return;
            editingSupplierId = id;
            supplierModalTitle.textContent = 'تعديل بيانات المورد';
            supplierName.value = supplier.name;
            supplierPhone.value = supplier.phone;
            supplierProducts.value = supplier.products;
            supplierHistory.value = supplier.history;
            supplierModal.classList.add('active');
        }

        function closeSupplierModalFn() {
            supplierModal.classList.remove('active');
        }

        function saveSupplier(e) {
            e.preventDefault();
            const name = supplierName.value.trim();
            const phone = supplierPhone.value.trim();
            const products = supplierProducts.value.trim() || 'غير محدد';
            const history = supplierHistory.value.trim() || 'لا يوجد';

            if (!name) {
                alert('الرجاء إدخال اسم المورد.');
                return;
            }

            let suppliers = getSuppliers();

            if (editingSupplierId) {
                const index = suppliers.findIndex(s => s.id === editingSupplierId);
                if (index !== -1) {
                    suppliers[index] = { ...suppliers[index], name, phone, products, history };
                }
            } else {
                suppliers.push({
                    id: getNextSupplierId(),
                    name,
                    phone,
                    products,
                    history
                });
            }

            saveSuppliers(suppliers);
            closeSupplierModalFn();
            renderSuppliers(supplierSearch.value);
        }

        // ============================================================
        //  التبويبات
        // ============================================================

        const tabButtons = document.querySelectorAll('.tab-switch button');
        const tabContents = {
            customers: document.getElementById('tab-customers'),
            suppliers: document.getElementById('tab-suppliers')
        };

        tabButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                tabButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                Object.values(tabContents).forEach(content => content.classList.remove('active'));

                const tab = this.dataset.tab;
                tabContents[tab].classList.add('active');

                if (tab === 'customers') {
                    renderCustomers(customerSearch.value);
                } else {
                    renderSuppliers(supplierSearch.value);
                }
            });
        });

        // ============================================================
        //  ربط الأحداث
        // ============================================================

        searchCustomerBtn.addEventListener('click', () => renderCustomers(customerSearch.value));
        customerSearch.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') renderCustomers(customerSearch.value);
        });

        searchSupplierBtn.addEventListener('click', () => renderSuppliers(supplierSearch.value));
        supplierSearch.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') renderSuppliers(supplierSearch.value);
        });

        addCustomerBtn.addEventListener('click', openAddCustomer);
        addSupplierBtn.addEventListener('click', openAddSupplier);

        closeCustomerModal.addEventListener('click', closeCustomerModalFn);
        cancelCustomerBtn.addEventListener('click', closeCustomerModalFn);
        customerModal.addEventListener('click', (e) => {
            if (e.target === customerModal) closeCustomerModalFn();
        });
        customerForm.addEventListener('submit', saveCustomer);

        closeSupplierModal.addEventListener('click', closeSupplierModalFn);
        cancelSupplierBtn.addEventListener('click', closeSupplierModalFn);
        supplierModal.addEventListener('click', (e) => {
            if (e.target === supplierModal) closeSupplierModalFn();
        });
        supplierForm.addEventListener('submit', saveSupplier);

        document.getElementById('logoutLink').addEventListener('click', function(e) {
            localStorage.removeItem('loggedIn');
            localStorage.removeItem('currentUser');
        });

        // ============================================================
        //  التحقق من الدخول
        // ============================================================

        function checkAuth() {
            if (localStorage.getItem('loggedIn') !== 'true') {
                window.location.href = 'index.html';
            }
        }

        // ============================================================
        //  التهيئة
        // ============================================================

        checkAuth();
        renderCustomers();
        renderSuppliers();
        console.log('✅ صفحة العملاء والموردين جاهزة مع localStorage');
    </script>

</body>
</html>
